name: anti_theft_pocket_shield
description: "Anti-Theft Pocket Shield - Mobile Chori Se Bachane Wala App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Sensors
  sensors_plus: ^6.1.1

  # Audio
  audioplayers: ^6.4.0

  # Vibration
  vibration: ^3.1.3

  # State Management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.3.2

  # Permissions
  permission_handler: ^11.3.1

  # Screen Wake Lock
  wakelock_plus: ^1.2.8

  # Fonts
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
